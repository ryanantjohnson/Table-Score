name: TableRec iOS Release

# Signing secrets:
# TABLEREC_IOS_DISTRIBUTION_CERTIFICATE_BASE64
# TABLEREC_IOS_ENCRYPTED_PRIVATE_KEY
# TABLEREC_IOS_CERTIFICATE_PASSWORD
# TABLEREC_IOS_PROFILE_BASE64
#
# Apple upload secrets:
# TABLEREC_APPLE_API_KEY_ID
# TABLEREC_APPLE_API_ISSUER_ID
# TABLEREC_APPLE_API_PRIVATE_KEY
#
# Store secret values in GitHub Actions secrets only.

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed App Store IPA
        type: boolean
        default: false
      upload_to_apple:
        description: Upload signed IPA to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tablerec-ios-release
  cancel-in-progress: false

jobs:
  ios:
    name: Build TableRec for iPhone
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TR_TEAM_ID: X9NC4BRLJ7
      TR_BUNDLE_ID: com.ryanantjohnson.tablerec
      TR_VERSION: '1.0'
      TR_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - name: Check options and required secrets
        env:
          TR_SIGNED: ${{ inputs.signed_release }}
          TR_UPLOAD: ${{ inputs.upload_to_apple }}
          TR_CERT: ${{ secrets.TABLEREC_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          TR_ENCRYPTED_KEY: ${{ secrets.TABLEREC_IOS_ENCRYPTED_PRIVATE_KEY }}
          TR_CERT_PASSWORD: ${{ secrets.TABLEREC_IOS_CERTIFICATE_PASSWORD }}
          TR_PROFILE: ${{ secrets.TABLEREC_IOS_PROFILE_BASE64 }}
          TR_API_KEY_ID: ${{ secrets.TABLEREC_APPLE_API_KEY_ID }}
          TR_API_ISSUER_ID: ${{ secrets.TABLEREC_APPLE_API_ISSUER_ID }}
          TR_API_PRIVATE_KEY: ${{ secrets.TABLEREC_APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$TR_UPLOAD" == true && "$TR_SIGNED" != true ]]; then
            echo 'Enable signed_release before enabling upload_to_apple.'
            exit 1
          fi
          if [[ "$TR_SIGNED" == true ]]; then
            for variable in TR_CERT TR_ENCRYPTED_KEY TR_CERT_PASSWORD TR_PROFILE; do
              if [[ -z "${!variable}" ]]; then
                echo "Missing signing secret: $variable."
                exit 1
              fi
            done
          fi
          if [[ "$TR_UPLOAD" == true ]]; then
            for variable in TR_API_KEY_ID TR_API_ISSUER_ID TR_API_PRIVATE_KEY; do
              if [[ -z "${!variable}" ]]; then
                echo "Missing Apple upload secret: $variable."
                exit 1
              fi
            done
          fi

      - name: Read repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check Xcode version
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import subprocess
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          major = int(version.splitlines()[0].split()[1].split('.')[0])
          if major < 26:
              raise SystemExit('Xcode 26 or newer is required for this iOS release.')
          PY

      - name: Install native dependencies and bundle web pages
        working-directory: native
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          node prepare-web.mjs

      - name: Generate iOS project
        working-directory: native
        run: |
          set -euo pipefail
          if [[ ! -d ios ]]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios

      - name: Add optional contact invitation picker
        working-directory: native
        run: |
          set -euo pipefail
          cat > ios/App/App/TableRecContacts.swift <<'SWIFT'
          import UIKit
          import Capacitor
          import Contacts
          import ContactsUI
          import MessageUI

          @objc(TableRecContactsPlugin)
          public class TableRecContactsPlugin: CAPPlugin, CAPBridgedPlugin, CNContactPickerDelegate, MFMessageComposeViewControllerDelegate, MFMailComposeViewControllerDelegate {
              public let identifier = "TableRecContactsPlugin"
              public let jsName = "TableRecContacts"
              public let pluginMethods: [CAPPluginMethod] = [CAPPluginMethod(name: "invite", returnType: CAPPluginReturnPromise)]
              private var pending: CAPPluginCall?
              private let invitation = "Join me on TableRec to discover restaurants, share ratings, and find your next good meal. https://ryanantjohnson.github.io/Table-Score/"

              @objc func invite(_ call: CAPPluginCall) {
                  DispatchQueue.main.async {
                      guard self.pending == nil else {
                          call.reject("An invitation is already open.")
                          return
                      }
                      guard let host = self.bridge?.viewController, host.presentedViewController == nil else {
                          call.reject("Close the open screen and try again.")
                          return
                      }
                      self.pending = call
                      let picker = CNContactPickerViewController()
                      picker.delegate = self
                      picker.displayedPropertyKeys = [CNContactPhoneNumbersKey, CNContactEmailAddressesKey]
                      picker.predicateForEnablingContact = NSPredicate(format: "phoneNumbers.@count > 0 OR emailAddresses.@count > 0")
                      picker.predicateForSelectionOfProperty = NSPredicate(format: "key == 'phoneNumbers' OR key == 'emailAddresses'")
                      host.present(picker, animated: true)
                  }
              }

              public func contactPickerDidCancel(_ picker: CNContactPickerViewController) {
                  finish("cancelled")
              }

              public func contactPicker(_ picker: CNContactPickerViewController, didSelect contactProperty: CNContactProperty) {
                  let phone = (contactProperty.value as? CNPhoneNumber)?.stringValue
                  let email = contactProperty.key == CNContactEmailAddressesKey ? contactProperty.value as? String : nil
                  picker.dismiss(animated: true) {
                      guard let host = self.bridge?.viewController else {
                          self.finish("cancelled")
                          return
                      }
                      if let phone = phone, MFMessageComposeViewController.canSendText() {
                          let composer = MFMessageComposeViewController()
                          composer.messageComposeDelegate = self
                          composer.recipients = [phone]
                          composer.body = self.invitation
                          host.present(composer, animated: true)
                      } else if let email = email, MFMailComposeViewController.canSendMail() {
                          let composer = MFMailComposeViewController()
                          composer.mailComposeDelegate = self
                          composer.setToRecipients([email])
                          composer.setSubject("Join me on TableRec")
                          composer.setMessageBody(self.invitation, isHTML: false)
                          host.present(composer, animated: true)
                      } else {
                          self.pending?.reject("Messages or Mail is not available for that contact. Use Share an Invitation instead.")
                          self.pending = nil
                      }
                  }
              }

              public func messageComposeViewController(_ controller: MFMessageComposeViewController, didFinishWith result: MessageComposeResult) {
                  controller.dismiss(animated: true) {
                      self.finish(result == .sent ? "sent" : result == .cancelled ? "cancelled" : "failed")
                  }
              }

              public func mailComposeController(_ controller: MFMailComposeViewController, didFinishWith result: MFMailComposeResult, error: Error?) {
                  controller.dismiss(animated: true) {
                      self.finish(result == .sent ? "sent" : result == .saved ? "saved" : result == .cancelled ? "cancelled" : "failed")
                  }
              }

              private func finish(_ status: String) {
                  pending?.resolve(["status": status])
                  pending = nil
              }
          }

          @objc(TableRecBridgeViewController)
          class TableRecBridgeViewController: CAPBridgeViewController {
              override func capacitorDidLoad() {
                  bridge?.registerPluginInstance(TableRecContactsPlugin())
              }
          }
          SWIFT
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'Missing App target' unless app
          group = project.main_group.find_subpath('App', false)
          abort 'Missing App group' unless group
          file = group.files.find { |item| item.path == 'TableRecContacts.swift' } || group.new_file('TableRecContacts.swift')
          app.source_build_phase.add_file_reference(file, true)
          project.save
          RUBY
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('ios/App/App/Base.lproj/Main.storyboard')
          s = path.read_text()
          if 'customClass="CAPBridgeViewController"' not in s:
              raise SystemExit('Expected Capacitor storyboard bridge controller')
          s = s.replace('customClass="CAPBridgeViewController"', 'customClass="TableRecBridgeViewController"')
          s = s.replace('customModule="Capacitor"', 'customModule="App"')
          path.write_text(s)
          PYTHON

      - name: Prepare approved icon and splash
        working-directory: native
        run: |
          set -euo pipefail
          npm install --prefix build/branding-tools --no-save --no-package-lock --no-audit --no-fund sharp@0.34.5 @capacitor/assets@3.0.5
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const sharp = require(path.resolve('build/branding-tools/node_modules/sharp'));

          async function main() {
            const html = fs.readFileSync('../index.html', 'utf8');
            const extract = name => {
              const match = html.match(new RegExp('--tr-' + name + ':url\\("data:image/webp;base64,([A-Za-z0-9+/=]+)"\\)'));
              if (!match) throw Error('Missing approved embedded asset: ' + name);
              return Buffer.from(match[1], 'base64');
            };
            const orange = '#f36f21';
            fs.mkdirSync('assets', {recursive: true});
            await sharp(extract('icon'))
              .resize(1024, 1024)
              .flatten({background: orange})
              .png()
              .toFile('assets/icon-only.png');
            const mark = await sharp(extract('mark')).resize(620, 620).png().toBuffer();
            const wordmark = await sharp(extract('wordmark')).resize({width: 1000}).png().toBuffer();
            const splash = await sharp({
              create: {width: 2732, height: 2732, channels: 3, background: orange}
            })
              .composite([
                {input: mark, left: 1056, top: 846},
                {input: wordmark, left: 866, top: 1520}
              ])
              .png()
              .toBuffer();
            fs.writeFileSync('assets/splash.png', splash);
            fs.writeFileSync('assets/splash-dark.png', splash);
            const icon = await sharp('assets/icon-only.png').metadata();
            if (icon.width !== 1024 || icon.height !== 1024 || icon.hasAlpha) {
              throw Error('Invalid iOS icon');
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          node build/branding-tools/node_modules/@capacitor/assets/bin/capacitor-assets generate --ios --iconBackgroundColor '#f36f21' --iconBackgroundColorDark '#f36f21' --splashBackgroundColor '#f36f21' --splashBackgroundColorDark '#f36f21'

      - name: Configure location and camera explanations
        working-directory: native
        run: |
          python3 - <<'PY'
          import plistlib
          import os
          from pathlib import Path

          path = Path('ios/App/App/Info.plist')
          info = plistlib.loads(path.read_bytes())
          info['CFBundleShortVersionString'] = os.environ['TR_VERSION']
          info['CFBundleVersion'] = os.environ['TR_BUILD_NUMBER']
          info['NSLocationWhenInUseUsageDescription'] = (
              'TableRec uses your location while you use the app to find nearby '
              'restaurants, choose RUN IT suggestions, and verify restaurant visits. '
              'You can browse a selected area without sharing your location.'
          )
          info['NSLocationAlwaysAndWhenInUseUsageDescription'] = info['NSLocationWhenInUseUsageDescription']
          if 'location' in info.get('UIBackgroundModes', []):
              raise SystemExit('Unexpected background location mode; review before building.')
          info['NSCameraUsageDescription'] = (
              'TableRec uses your camera when you choose to take '
              'a photo for your profile or a restaurant rating.'
          )
          path.write_bytes(plistlib.dumps(info, sort_keys=False))
          PY
          plutil -lint ios/App/App/Info.plist

      - name: Install distribution signing material
        if: inputs.signed_release
        env:
          TR_CERT: ${{ secrets.TABLEREC_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          TR_ENCRYPTED_KEY: ${{ secrets.TABLEREC_IOS_ENCRYPTED_PRIVATE_KEY }}
          TR_CERT_PASSWORD: ${{ secrets.TABLEREC_IOS_CERTIFICATE_PASSWORD }}
          TR_PROFILE: ${{ secrets.TABLEREC_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP'])
          for variable, filename in [
              ('TR_CERT', 'tablerec-distribution.cer'),
              ('TR_PROFILE', 'tablerec.mobileprovision')
          ]:
              value = ''.join(os.environ[variable].split())
              (directory / filename).write_bytes(base64.b64decode(value, validate=True))
          PY
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ['TR_ENCRYPTED_KEY'].strip() + '\n'
          if not key.startswith('-----BEGIN ENCRYPTED PRIVATE KEY-----') or not key.rstrip().endswith('-----END ENCRYPTED PRIVATE KEY-----'):
              raise SystemExit('Encrypted private key secret must contain the complete file text.')
          (Path(os.environ['RUNNER_TEMP']) / 'tablerec-encrypted-private-key.pem').write_text(key)
          PY
          openssl x509 -inform DER -in "$RUNNER_TEMP/tablerec-distribution.cer" \
            -out "$RUNNER_TEMP/tablerec-distribution.pem"
          openssl pkcs12 -export -in "$RUNNER_TEMP/tablerec-distribution.pem" \
            -inkey "$RUNNER_TEMP/tablerec-encrypted-private-key.pem" \
            -passin env:TR_CERT_PASSWORD -passout env:TR_CERT_PASSWORD \
            -out "$RUNNER_TEMP/tablerec.p12"
          TR_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$TR_KEYCHAIN_PASSWORD"
          TR_KEYCHAIN_PATH="$RUNNER_TEMP/tablerec-signing.keychain-db"
          security create-keychain -p "$TR_KEYCHAIN_PASSWORD" "$TR_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$TR_KEYCHAIN_PATH"
          security unlock-keychain -p "$TR_KEYCHAIN_PASSWORD" "$TR_KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/tablerec.p12" -P "$TR_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$TR_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$TR_KEYCHAIN_PASSWORD" "$TR_KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$TR_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/tablerec.mobileprovision" > "$RUNNER_TEMP/tablerec-profile.plist"
          python3 - <<'PY'
          import datetime, os, plistlib, shutil, subprocess, hashlib
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((directory / 'tablerec-profile.plist').read_bytes())
          team = os.environ['TR_TEAM_ID']
          bundle = os.environ['TR_BUNDLE_ID']
          entitlements = profile['Entitlements']
          if profile.get('TeamIdentifier') != [team]:
              raise SystemExit('Signing profile belongs to a different team.')
          if entitlements.get('application-identifier') != team + '.' + bundle:
              raise SystemExit('Signing profile does not match TableRec bundle ID.')
          if entitlements.get('get-task-allow') or profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices'):
              raise SystemExit('Expected an App Store distribution profile.')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit('Signing profile has expired.')
          identities = subprocess.check_output([
              'security', 'find-identity', '-v', '-p', 'codesigning',
              str(directory / 'tablerec-signing.keychain-db')
          ], text=True)
          fingerprints = [
              hashlib.sha1(cert).hexdigest().upper()
              for cert in profile['DeveloperCertificates']
          ]
          if not any(fingerprint in identities for fingerprint in fingerprints):
              raise SystemExit('Profile and installed signing certificate do not match.')
          uuid = profile['UUID']
          for root in [
              Path.home() / 'Library/MobileDevice/Provisioning Profiles',
              Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          ]:
              root.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(
                  directory / 'tablerec.mobileprovision',
                  root / (uuid + '.mobileprovision')
              )
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TR_PROFILE_UUID=' + uuid + '\n')
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'teamID': team,
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {bundle: uuid},
              'manageAppVersionAndBuildNumber': False
          }
          (directory / 'tablerec-export.plist').write_bytes(plistlib.dumps(options))
          PY

      - name: Configure app target
        working-directory: native
        env:
          TR_SIGNED: ${{ inputs.signed_release }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'Missing App target' unless app
          app.build_configurations.each do |config|
            settings = config.build_settings
            settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('TR_BUNDLE_ID')
            settings['DEVELOPMENT_TEAM'] = ENV.fetch('TR_TEAM_ID')
            settings['MARKETING_VERSION'] = ENV.fetch('TR_VERSION')
            settings['CURRENT_PROJECT_VERSION'] = ENV.fetch('TR_BUILD_NUMBER')
            settings['TARGETED_DEVICE_FAMILY'] = '1'
            if ENV['TR_SIGNED'] == 'true'
              settings['CODE_SIGN_STYLE'] = 'Manual'
              settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('TR_PROFILE_UUID')
            end
          end
          project.save
          RUBY

      - name: Archive for physical iPhone
        working-directory: native
        env:
          TR_SIGNED: ${{ inputs.signed_release }}
        run: |
          set -euo pipefail
          set --
          if [[ "$TR_SIGNED" != true ]]; then
            set -- CODE_SIGNING_ALLOWED=NO
          fi
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/TableRec.xcarchive \
            "$@" archive
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path

          path = Path('build/TableRec.xcarchive/Products/Applications/App.app/Info.plist')
          info = plistlib.loads(path.read_bytes())
          expected = {
              'CFBundleIdentifier': os.environ['TR_BUNDLE_ID'],
              'CFBundleShortVersionString': os.environ['TR_VERSION'],
              'CFBundleVersion': os.environ['TR_BUILD_NUMBER']
          }
          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit('Unexpected archive metadata: ' + key)
          if info.get('UIDeviceFamily') != [1]:
              raise SystemExit('Expected an iPhone-only app.')
          if not info.get('NSCameraUsageDescription'):
              raise SystemExit('Camera usage explanation is missing from the archive.')
          print('Archive bundle ID, version, build number, camera permission and iPhone target verified.')
          PY

      - name: Export signed App Store IPA
        if: inputs.signed_release
        working-directory: native
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/TableRec.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/tablerec-export.plist" \
            -exportPath build/release
          mkdir -p release-artifacts
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          files = list(Path('build/release').glob('*.ipa'))
          if len(files) != 1:
              raise SystemExit('Expected exactly one exported IPA.')
          shutil.copyfile(files[0], 'release-artifacts/TableRec.ipa')
          PY
          codesign --verify --deep --strict build/TableRec.xcarchive/Products/Applications/App.app

      - name: Save signed IPA
        if: inputs.signed_release
        uses: actions/upload-artifact@v4
        with:
          name: TableRec-iOS-Release-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/release-artifacts/TableRec.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Validate and upload to Apple
        if: inputs.upload_to_apple
        env:
          TR_API_KEY_ID: ${{ secrets.TABLEREC_APPLE_API_KEY_ID }}
          TR_API_ISSUER_ID: ${{ secrets.TABLEREC_APPLE_API_ISSUER_ID }}
          TR_API_PRIVATE_KEY: ${{ secrets.TABLEREC_APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, uuid, subprocess
          from pathlib import Path

          key_id = os.environ['TR_API_KEY_ID']
          issuer = os.environ['TR_API_ISSUER_ID']
          if not re.fullmatch(r'[A-Z0-9]{10}', key_id):
              raise SystemExit('Apple API Key ID must be the 10-character ID for the downloaded key, without spaces.')
          try:
              uuid.UUID(issuer)
          except ValueError:
              raise SystemExit('Apple API Issuer ID must be the UUID from the Team Keys page.')
          if issuer != issuer.strip():
              raise SystemExit('Remove extra spaces from the Apple API Issuer ID.')
          key = os.environ['TR_API_PRIVATE_KEY'].strip() + '\n'
          if not key.startswith('-----BEGIN PRIVATE KEY-----\n') or not key.rstrip().endswith('-----END PRIVATE KEY-----'):
              raise SystemExit('Copy the complete .p8 text, including BEGIN and END lines and original line breaks.')
          folder = Path.home() / '.appstoreconnect/private_keys'
          folder.mkdir(parents=True, exist_ok=True, mode=0o700)
          path = folder / ('AuthKey_' + key_id + '.p8')
          path.write_text(key)
          path.chmod(0o600)
          result = subprocess.run(
              ['openssl', 'pkey', '-in', str(path), '-noout'],
              capture_output=True
          )
          if result.returncode:
              raise SystemExit('Invalid Apple API private key. Check the complete downloaded .p8 text.')
          PY
          xcrun altool --validate-app -f native/release-artifacts/TableRec.ipa -t ios \
            --apiKey "$TR_API_KEY_ID" --apiIssuer "$TR_API_ISSUER_ID"
          xcrun altool --upload-app -f native/release-artifacts/TableRec.ipa -t ios \
            --apiKey "$TR_API_KEY_ID" --apiIssuer "$TR_API_ISSUER_ID"

      - name: Record result
        env:
          TR_SIGNED: ${{ inputs.signed_release }}
          TR_UPLOAD: ${{ inputs.upload_to_apple }}
        run: |
          python3 - <<'PY'
          import os

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## TableRec iOS build passed\n\n')
              report.write('Version ' + os.environ['TR_VERSION'] + ', build ' + os.environ['TR_BUILD_NUMBER'] + '.\n\n')
              if os.environ['TR_SIGNED'] == 'true':
                  report.write('Signed App Store IPA saved in the run artifacts.\n\n')
              else:
                  report.write('Unsigned physical-iPhone archive compiled successfully. It cannot be installed or uploaded.\n\n')
              if os.environ['TR_UPLOAD'] == 'true':
                  report.write('Upload command completed. Apple processing must finish before the build appears in TestFlight. This workflow does not submit for App Review or publish the app.\n\n')
              report.write('Real-device testing of authentication, photos and location remains required.\n')
          PY

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/tablerec-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/tablerec-signing.keychain-db" || true
          fi
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP'])
          profile = directory / 'tablerec-profile.plist'
          if profile.exists():
              uuid = plistlib.loads(profile.read_bytes()).get('UUID')
              if uuid:
                  for root in [
                      Path.home() / 'Library/MobileDevice/Provisioning Profiles',
                      Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
                  ]:
                      (root / (uuid + '.mobileprovision')).unlink(missing_ok=True)
          for filename in [
              'tablerec.p12',
              'tablerec-distribution.cer',
              'tablerec-distribution.pem',
              'tablerec-encrypted-private-key.pem',
              'tablerec.mobileprovision',
              'tablerec-profile.plist',
              'tablerec-export.plist'
          ]:
              (directory / filename).unlink(missing_ok=True)
          folder = Path.home() / '.appstoreconnect/private_keys'
          if folder.exists():
              for path in folder.glob('AuthKey_*.p8'):
                  path.unlink()
          PY
