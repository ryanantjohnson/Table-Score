name: TableRec Native Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tablerec-native.yml
      - native/**
      - index.html
      - legal.html

permissions:
  contents: read

concurrency:
  group: tablerec-native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} test app
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            runner: macos-latest
          - platform: Android
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Read repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check TableRec web source
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          for (const file of ['index.html', 'legal.html']) {
            if (!fs.existsSync(file)) throw new Error('Missing required file: ' + file);
            const html = fs.readFileSync(file, 'utf8');
            if (!/<html\b/i.test(html) || !/<\/html>/i.test(html)) {
              throw new Error('Incomplete HTML document: ' + file);
            }
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            let checked = 0;
            for (const [, attributes, code] of scripts) {
              if (/\bsrc\s*=/i.test(attributes)) continue;
              if (/\btype\s*=\s*["'](?:application\/ld\+json|application\/json|importmap)["']/i.test(attributes)) continue;
              if (/\btype\s*=\s*["']module["']/i.test(attributes)) {
                throw new Error('Module script needs a module syntax check: ' + file);
              }
              new vm.Script(code, { filename: file + ':inline-' + checked });
              checked++;
            }
            console.log(file + ': document present; ' + checked + ' inline scripts parse.');
          }
          console.log('Syntax check only. Native permissions and device behavior still require testing.');
          JS

      - name: Prepare Java for Android
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        working-directory: native
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Bundle TableRec web files
        working-directory: native
        run: node prepare-web.mjs

      - name: Prepare approved TableRec branding assets
        working-directory: native
        shell: bash
        run: |
          npm install --prefix build/branding-tools --no-save --no-package-lock --no-audit --no-fund sharp@0.34.5 @capacitor/assets@3.0.5
          node <<'JS'
          // Native build-time asset preparation. Does not change authentication or permissions.
          const fs=require('node:fs');
          const path=require('node:path');
          const sharp=require(path.resolve('build/branding-tools/node_modules/sharp'));
          async function main(){
           const html=fs.readFileSync('../index.html','utf8');
           const extract=name=>{
             const match=html.match(new RegExp('--tr-'+name+':url\\("data:image/webp;base64,([A-Za-z0-9+/=]+)"\\)'));
             if(!match)throw Error('Missing embedded approved '+name+' asset: update index.html first.');
             return Buffer.from(match[1],'base64');
           };
           const icon=extract('icon'),wordmark=extract('wordmark'),mark=extract('mark');
           const orange='#f36f21';
           fs.mkdirSync('assets',{recursive:true});
           const fullIcon=await sharp(icon).resize(1024,1024).flatten({background:orange}).png().toBuffer();
           fs.writeFileSync('assets/icon-only.png',fullIcon);
           // Android adaptive icon foreground: keep the mark inside the mask's safe center.
           const adaptive=await sharp(mark).resize(640,640).png().toBuffer();
           await sharp({create:{width:1024,height:1024,channels:4,background:{r:0,g:0,b:0,alpha:0}}})
             .composite([{input:adaptive,left:192,top:192}]).png().toFile('assets/icon-foreground.png');
           await sharp({create:{width:1024,height:1024,channels:3,background:orange}}).png().toFile('assets/icon-background.png');
           const splashIcon=await sharp(mark).resize(620,620).png().toBuffer();
           const splashWordmark=await sharp(wordmark).resize({width:1000}).png().toBuffer();
           const splash=await sharp({create:{width:2732,height:2732,channels:3,background:orange}})
             .composite([{input:splashIcon,left:1056,top:846},{input:splashWordmark,left:866,top:1520}])
             .png().toBuffer();
           fs.writeFileSync('assets/splash.png',splash);
           fs.writeFileSync('assets/splash-dark.png',splash);
           for(const file of ['icon-only.png','icon-foreground.png','icon-background.png','splash.png','splash-dark.png']){
             const metadata=await sharp(path.join('assets',file)).metadata();
             const expected=file.startsWith('splash')?2732:1024;
             if(metadata.width!==expected||metadata.height!==expected)throw Error('Invalid asset dimensions: '+file);
             if(file==='icon-only.png'&&metadata.hasAlpha)throw Error('iOS icon must be opaque.');
           }
           console.log('Approved TableRec native icon and launch artwork prepared and checked.');
          }
          main().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Generate iOS project
        if: matrix.platform == 'iOS'
        working-directory: native
        shell: bash
        run: |
          xcodebuild -version
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios

      - name: Configure iOS foreground location permission
        if: matrix.platform == 'iOS'
        working-directory: native
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path
          path = Path('ios/App/App/Info.plist')
          with path.open('rb') as source:
              info = plistlib.load(source)
          info['NSLocationWhenInUseUsageDescription'] = (
              'TableRec uses your location while you use the app to find nearby '
              'restaurants, choose RUN IT suggestions, and verify restaurant visits. '
              'You can browse a selected area without sharing your location.'
          )
          if any(key in info for key in ['NSLocationAlwaysUsageDescription', 'NSLocationAlwaysAndWhenInUseUsageDescription']):
              raise RuntimeError('Unexpected always-location permission: review before building.')
          if 'location' in info.get('UIBackgroundModes', []):
              raise RuntimeError('Unexpected background location mode: review before building.')
          with path.open('wb') as output:
              plistlib.dump(info, output, sort_keys=False)
          with path.open('rb') as output:
              assert plistlib.load(output)['NSLocationWhenInUseUsageDescription'] == info['NSLocationWhenInUseUsageDescription']
          print('iOS foreground location explanation configured and verified.')
          PYTHON
          plutil -lint ios/App/App/Info.plist

      - name: Generate branded iOS icons and splash artwork
        if: matrix.platform == 'iOS'
        working-directory: native
        shell: bash
        run: |
          node build/branding-tools/node_modules/@capacitor/assets/bin/capacitor-assets generate --ios --iconBackgroundColor '#f36f21' --iconBackgroundColorDark '#f36f21' --splashBackgroundColor '#f36f21' --splashBackgroundColorDark '#f36f21'


      - name: Build unsigned iOS simulator app
        if: matrix.platform == 'iOS'
        working-directory: native
        shell: bash
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            artifacts/TableRec-iOS-Simulator.zip

      - name: Generate Android project
        if: matrix.platform == 'Android'
        working-directory: native
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Android foreground location permissions
        if: matrix.platform == 'Android'
        working-directory: native
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          android = 'http://schemas.android.com/apk/res/android'
          for _, (prefix, uri) in ET.iterparse(path, events=['start-ns']):
              ET.register_namespace(prefix, uri)
          tree = ET.parse(path)
          root = tree.getroot()
          if root.tag != 'manifest':
              raise RuntimeError('Expected an Android manifest.')
          name = '{' + android + '}name'
          required = '{' + android + '}required'
          permissions = {item.get(name) for item in root.findall('uses-permission')}
          if 'android.permission.ACCESS_BACKGROUND_LOCATION' in permissions:
              raise RuntimeError('Unexpected background location permission: review before building.')
          for permission in ['android.permission.ACCESS_COARSE_LOCATION', 'android.permission.ACCESS_FINE_LOCATION']:
              if permission not in permissions:
                  root.append(ET.Element('uses-permission', {name: permission}))
          # Do not exclude devices without a dedicated GPS sensor.
          gps = next((item for item in root.findall('uses-feature') if item.get(name) == 'android.hardware.location.gps'), None)
          if gps is None:
              gps = ET.SubElement(root, 'uses-feature', {name: 'android.hardware.location.gps'})
          gps.set(required, 'false')
          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          verified = ET.parse(path).getroot()
          permissions = {item.get(name) for item in verified.findall('uses-permission')}
          assert {'android.permission.ACCESS_COARSE_LOCATION', 'android.permission.ACCESS_FINE_LOCATION'} <= permissions
          assert 'android.permission.ACCESS_BACKGROUND_LOCATION' not in permissions
          assert verified.find('application') is not None
          print('Android approximate/precise foreground location permissions configured and verified.')
          PYTHON

      - name: Generate branded Android icons and splash artwork
        if: matrix.platform == 'Android'
        working-directory: native
        shell: bash
        run: |
          node build/branding-tools/node_modules/@capacitor/assets/bin/capacitor-assets generate --android --iconBackgroundColor '#f36f21' --iconBackgroundColorDark '#f36f21' --splashBackgroundColor '#f36f21' --splashBackgroundColorDark '#f36f21'
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('android/app/src/main/res/values/styles.xml')
          tree = ET.parse(path)
          style = next((item for item in tree.getroot().findall('style') if item.get('name') == 'AppTheme.NoActionBarLaunch'), None)
          if style is None:
              raise RuntimeError('Expected Capacitor Android launch style.')
          values = {
              'windowSplashScreenBackground': '#f36f21',
              'windowSplashScreenAnimatedIcon': '@mipmap/ic_launcher',
              'postSplashScreenTheme': '@style/AppTheme.NoActionBar',
          }
          for name, value in values.items():
              element = next((item for item in style.findall('item') if item.get('name') == name), None)
              if element is None:
                  element = ET.SubElement(style, 'item', {'name': name})
              element.text = value
          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          verified = ET.parse(path).getroot()
          style = next(item for item in verified.findall('style') if item.get('name') == 'AppTheme.NoActionBarLaunch')
          assert all(next(item for item in style.findall('item') if item.get('name') == name).text == value for name, value in values.items())
          print('Android system launch screen uses approved orange and app icon.')
          PYTHON


      - name: Build Android debug APK
        if: matrix.platform == 'Android'
        working-directory: native/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/TableRec-Android-Debug.apk

      - name: Save test build
        uses: actions/upload-artifact@v4
        with:
          name: TableRec-${{ matrix.platform }}-test-build
          path: |
            native/artifacts/*
            native/assets/icon-only.png
            native/assets/splash.png
            native/package-lock.json
            native/ios/App/App/Info.plist
            native/android/app/src/main/AndroidManifest.xml
          retention-days: 7
          if-no-files-found: error

      - name: Record build result
        if: success()
        shell: bash
        env:
          TR_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## TableRec ' + os.environ['TR_PLATFORM'] + ' test build passed\n\n')
              report.write('Download the test build from this run\'s Artifacts section.\n\n')
              report.write('Android: debug APK for Android devices.\n\n')
              report.write('iOS: unsigned simulator app; cannot be installed on an iPhone.\n\n')
              report.write('Foreground location declarations are configured and checked by this workflow.\n\n')
              report.write('Approved TableRec icon and native launch artwork were generated for this build. Android 12+ displays the system app icon before the matching in-app launch screen. Location prompts, GPS, authentication links, and other behavior still require real-device testing. Signing and store readiness work remain pending. This is not a store release.\n')
          PYTHON
