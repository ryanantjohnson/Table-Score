name: TableRec Native Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tablerec-native.yml
      - native/**
      - index.html
      - legal.html

permissions:
  contents: read

concurrency:
  group: tablerec-native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} test app
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            runner: macos-latest
          - platform: Android
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Read repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check TableRec web source
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          for (const file of ['index.html', 'legal.html']) {
            if (!fs.existsSync(file)) throw new Error('Missing required file: ' + file);
            const html = fs.readFileSync(file, 'utf8');
            if (!/<html\b/i.test(html) || !/<\/html>/i.test(html)) {
              throw new Error('Incomplete HTML document: ' + file);
            }
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            let checked = 0;
            for (const [, attributes, code] of scripts) {
              if (/\bsrc\s*=/i.test(attributes)) continue;
              if (/\btype\s*=\s*["'](?:application\/ld\+json|application\/json|importmap)["']/i.test(attributes)) continue;
              if (/\btype\s*=\s*["']module["']/i.test(attributes)) {
                throw new Error('Module script needs a module syntax check: ' + file);
              }
              new vm.Script(code, { filename: file + ':inline-' + checked });
              checked++;
            }
            console.log(file + ': document present; ' + checked + ' inline scripts parse.');
          }
          console.log('Syntax check only. Native permissions and device behavior still require testing.');
          JS

      - name: Prepare Java for Android
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        working-directory: native
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Bundle TableRec web files
        working-directory: native
        run: node prepare-web.mjs

      - name: Generate iOS project
        if: matrix.platform == 'iOS'
        working-directory: native
        shell: bash
        run: |
          xcodebuild -version
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios

      - name: Build unsigned iOS simulator app
        if: matrix.platform == 'iOS'
        working-directory: native
        shell: bash
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Debug-iphonesimulator/App.app \
            artifacts/TableRec-iOS-Simulator.zip

      - name: Generate Android project
        if: matrix.platform == 'Android'
        working-directory: native
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Android debug APK
        if: matrix.platform == 'Android'
        working-directory: native/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/TableRec-Android-Debug.apk

      - name: Save test build
        uses: actions/upload-artifact@v4
        with:
          name: TableRec-${{ matrix.platform }}-test-build
          path: |
            native/artifacts/*
            native/package-lock.json
          retention-days: 7
          if-no-files-found: error

      - name: Record build result
        if: success()
        shell: bash
        env:
          TR_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## TableRec ' + os.environ['TR_PLATFORM'] + ' test build passed\n\n')
              report.write('Download the test build from this run\'s Artifacts section.\n\n')
              report.write('Android: debug APK for Android devices.\n\n')
              report.write('iOS: unsigned simulator app; cannot be installed on an iPhone.\n\n')
              report.write('Native permissions, app assets, authentication links, signing, and real-device QA remain pending. This is not a store release.\n')
          PYTHON
