name: Pro native preview checks
on:
  pull_request:
    paths:
      - 'native/pro-preview.*'
      - 'native/prepare-web.mjs'
      - 'tests/pro-native-smoke.cjs'
      - '.github/workflows/pro-native-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install isolated test dependency
        run: npm install --prefix "$RUNNER_TEMP/pro-test-deps" --no-audit --no-fund --no-package-lock jsdom@26
      - name: Check native Pro entry and screens
        run: NODE_PATH="$RUNNER_TEMP/pro-test-deps/node_modules" node tests/pro-native-smoke.cjs
      - name: Check tester and standard bundle separation
        run: |
          TR_PRO_PREVIEW=true node native/prepare-web.mjs
          node -e "const fs=require('fs'); if(!fs.readFileSync('native/www/index.html','utf8').includes('tableRecProPreviewEnabled=true')) throw Error('Missing tester entry'); for(const n of ['pro-preview.html','pro-preview.js']) if(!fs.existsSync('native/www/'+n))throw Error(n);"
          TR_PRO_PREVIEW=false node native/prepare-web.mjs
          node -e "const fs=require('fs'); if(fs.readFileSync('native/www/index.html','utf8').includes('tableRecProPreviewEnabled'))throw Error('Pro leaked into standard build');"
