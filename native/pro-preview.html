function openModal(title,body){lastFocus=document.activeElement;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;var dialog=document.getElementById('dialog');if(!dialog.open)dialog.showModal();document.getElementById('closeModal').focus();}
function closeModal(){document.getElementById('dialog').close();if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function openChecks(){var cc=runChecks();openModal('Prototype logic checks','<p>These checks cover sample-data logic only. They are not clinical validation or browser testing.</p>'+cc.map(function(t){return '<p>'+ (t.pass?'✓ ':'✕ ')+esc(t.name)+'</p>';}).join(''));}
function resetDemo(){if(!confirm('Clear all sample selections, recipes, plans and journal entries in this tab?'))return;location.reload();}
window.addEventListener('message',function(event){
 if(event.source!==window.parent||event.data?.type!=='tablerec-pro-context')return;
 var ctx=event.data;
 document.documentElement.dataset.appearance=ctx.dark?'dark':'light';
 if(typeof ctx.name==='string'){
  var av=document.querySelector('.avatar');if(av){av.textContent=ctx.name.slice(0,2).toUpperCase();av.setAttribute('aria-label','Your Pro account');}
 }
});
document.getElementById('dialog').addEventListener('close',function(){if(lastFocus&&lastFocus.isConnected)lastFocus.focus();});
document.getElementById('dialog').addEventListener('click',function(e){if(e.target===this)closeModal();});
render();
</script></body></html>
